name: Build and Package Pullar (Android)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p apk_output
          find android/app/build/outputs/apk/debug/ -name "*arm64-v8a*.apk" -exec cp {} apk_output/Pullar-v1.2.0-arm64-v8a.apk \;
          find android/app/build/outputs/apk/debug/ -name "*universal*.apk" -exec cp {} apk_output/Pullar-v1.2.0-universal.apk \;
          find android/app/build/outputs/apk/debug/ -name "*armeabi-v7a*.apk" -exec cp {} apk_output/Pullar-v1.2.0-armeabi-v7a.apk \;
          find android/app/build/outputs/apk/debug/ -name "*x86_64*.apk" -exec cp {} apk_output/Pullar-v1.2.0-x86_64.apk \;
          cp apk_output/Pullar-v1.2.0-arm64-v8a.apk apk_output/Pullar-v1.2.0-Android-debug.apk || true
          ls -la apk_output/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pullar-Android-APKs
          path: apk_output/*.apk
          retention-days: 30

      - name: Publish APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: apk_output/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.0' }}
