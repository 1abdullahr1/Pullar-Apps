name: Build and Package Pullar (Android)

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p apk_output
          cp android/app/build/outputs/apk/debug/*.apk apk_output/Pullar-v1.0.0-Android-debug.apk
          ls -la apk_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pullar-Android-APK
          path: apk_output/Pullar-v1.0.0-Android-debug.apk
          retention-days: 30
