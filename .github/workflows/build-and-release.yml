name: Build and Package Pullar (Windows)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtmultimedia'

      - name: Install Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja
          }
          ninja --version

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build VideoDownloader (Release)
        run: |
          cmake --build build --config Release

      - name: Stage Application & Run windeployqt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          
          $exePath = if (Test-Path "build\Release\VideoDownloader.exe") { "build\Release\VideoDownloader.exe" } else { "build\VideoDownloader.exe" }
          Write-Host "Found executable at: $exePath"
          Copy-Item $exePath dist\VideoDownloader.exe
          Copy-Item LICENSE dist\LICENSE.txt
          
          # Run windeployqt to bundle all required Qt runtime DLLs, multimedia plugins, and platform files
          windeployqt --release --compiler-runtime --no-translations --no-system-d3d-compiler dist\VideoDownloader.exe

      - name: Download & Bundle Standalone yt-dlp
        shell: pwsh
        run: |
          Write-Host "Downloading latest yt-dlp.exe..."
          try {
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "dist\yt-dlp.exe" -TimeoutSec 60
            Write-Host "Bundled yt-dlp.exe successfully."
          } catch {
            Write-Warning "Could not download yt-dlp: $_"
          }

      - name: Download & Bundle Standalone FFmpeg
        shell: pwsh
        run: |
          Write-Host "Downloading standalone FFmpeg..."
          try {
            $ffmpegZip = "ffmpeg.zip"
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $ffmpegZip -TimeoutSec 90
            Expand-Archive -Path $ffmpegZip -DestinationPath "ffmpeg_temp"
            $ffmpegExe = Get-ChildItem -Path "ffmpeg_temp" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
            if ($ffmpegExe) {
              Copy-Item $ffmpegExe.FullName -Destination "dist\ffmpeg.exe"
              Write-Host "Bundled ffmpeg.exe successfully."
            }
            Remove-Item -Recurse -Force "ffmpeg_temp", $ffmpegZip -ErrorAction SilentlyContinue
          } catch {
            Write-Warning "Could not download FFmpeg bundle: $_"
          }
          
          Write-Host "Staged dist directory contents:"
          Get-ChildItem -Path dist

      - name: Build Windows Installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler not found at $iscc"
            exit 1
          }
          $distPath = (Resolve-Path dist).Path
          & $iscc "/DSourceDir=$distPath" installer\downloader_installer.iss
          
          Write-Host "Generated installer in installer\Output:"
          Get-ChildItem -Path installer\Output

      - name: Create Portable Standalone ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath Pullar_v1.2.0_Portable.zip -CompressionLevel Optimal
          Get-Item Pullar_v1.2.0_Portable.zip

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pullar-Windows-Installer
          path: installer/Output/Pullar_Setup_v1.2.0.exe
          retention-days: 30

      - name: Upload Portable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pullar-Windows-Portable
          path: Pullar_v1.2.0_Portable.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/Pullar_Setup_v1.2.0.exe
            Pullar_v1.2.0_Portable.zip
          name: Pullar ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
